[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-resource-auditor"
version = "0.1.0"
description = "Read-only AWS FinOps candidates and transparent cost estimates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Huy Nguyen"}]
dependencies = ["boto3>=1.34,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.13,<2", "build>=1.2,<2"]

[project.scripts]
finops-audit = "finops_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finops_auditor = ["demo.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=finops_auditor --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
